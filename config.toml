# ============================================================
# Spain Power System — OPF configuration
# ============================================================

[scenario]
# ── Scenario selector (shared by the midterm SDDP and the market chain) ─────
# label = "2024" reproduces the original behaviour exactly (all 2024 inputs,
# no file suffix).  Any other label activates the EMPIRE-based future system:
#   • installed capacities per zone/tech   ← <empire_dir>/Output/genInstalledCap.tab
#   • marginal costs                       ← <empire_dir>/Output/marginal_costs.csv
#                                            + CO2 adder (3.6/η)·content·price from
#                                            the Input/Tab files (EMPIRE ran with an
#                                            emission cap, so its costs carry no CO2)
#   • annual demand per zone               ← Input/Tab/Node_ElectricAnnualDemand.tab
#   • cross-zone NTCs                      ← Output/transmissionInstalledCap.tab
#   • pumped-hydro + Li-Ion BESS           ← Output/stor{PW,EN}InstalledCap.tab
# All hourly shapes (EDF/EMPIRE weather years, Profile-Iberia, the ES/ES_old
# forecast factors), the bus-level network topology and the reservoir
# volumes/inflows stay at their 2024 sources.  The bus-level Spanish fleet is
# scaled per technology by the EMPIRE growth ratio (installed cap at `period`
# ÷ EMPIRE 2024 initial cap), so unit siting follows today's fleet.
# Every output (Bellman cuts, volume trajectory, cut JSON, diagnostics) gets
# the suffix "_<label>", and the market chain writes to results/<label>/ and
# reads its Bellman inputs from the suffixed [midterm4] outputs automatically.
label      = "2024"             # e.g. "NECP2035"
empire_dir = "Data/2035/GoRES"   # EMPIRE run (Input/Tab + Output) - Ignore if label = "2024"
period     = 2                            # EMPIRE period index: 2 = 2030-2035

# How the EMPIRE expansion is disaggregated onto the bus-level grid
# (empire_nodal.jl; diagnostics: julia --project=. empire_nodal.jl):
#   "nodal" — NUTS3 resolution.  Per (NUTS3, tech) the unit fleet is scaled to
#             EMPIRE's regional installed capacity (greenfield units are created
#             on the region's highest-load buses where a tech is new to the
#             region; hydro/nuclear are site-bound and never built greenfield).
#             EMPIRE's intra-ES corridor capacities scale the crossing lines'
#             ratings/impedances as parallel circuits, and brand-new corridors
#             get a synthetic 400 kV line.  BESS is sited per NUTS3 node.
#   "zonal" — original behaviour: one national growth ratio per tech, corridor
#             investments ignored, BESS on the top-20 load buses.
disaggregation = "nodal"

[network]
# Operator-tunable network security limits applied when assembling the grid.
#
#   voltage_band        — acceptable bus voltage deviation from nominal (1.0 pu).
#                         Bus voltage magnitudes are constrained to
#                         [1 − voltage_band, 1 + voltage_band].
#                         0.05 ⇒ ±5 % (0.95–1.05 pu).
#
#   line_rating_factor  — fraction of each transmission element's thermal
#                         nameplate rating made available to the OPF, derated for
#                         N-1 / reliability margin.  Applies to AC lines,
#                         transformers and HVDC links.  0.70 ⇒ 70 % of nameplate.
voltage_band       = 0.1
line_rating_factor = 1

# Generator voltage regulation (AVR).  Synchronous-machine buses (and the slack)
# are voltage-regulated, so hold them to a tighter band than the load buses — the
# voltage profile then follows realistic AVR setpoints instead of the cost-/loss-
# minimising OPF railing every bus up to vmax.  Renewable-only and load buses keep
# voltage_band.  Set gen_bus_voltage_control = false to relax this (use
# voltage_band everywhere).
gen_bus_voltage_control = true
gen_bus_vmin            = 0.98
gen_bus_vmax            = 1.03

[reactors]
# Shunt reactors that absorb the reactive power generated by EHV line charging
# (the π-model shunt susceptance of every AC line).  Without them the generators
# are forced to soak up ~21 GVAr of charging and bus voltages ride at the upper
# band.  The installed peninsular fleet is taken from REE's Boletín Mensual de
# diciembre 2024 (400 kV: 11 750 MVAr; ≤220 kV: 3 722 MVAr) and disaggregated to
# individual buses in proportion to the line charging connected at each bus.  The
# per-bus result is cached in Data/reactors.csv (delete it to regenerate after a
# line-data change); see the README "Shunt reactors" section.
#
#   enabled         — attach the reactor shunts to the AC network.
#   in_service_pct  — percent of the installed fleet that is energised at the
#                     operating point (a single knob, 0 = none, 100 = full
#                     fleet; values >100 are allowed for sensitivity studies).
enabled        = true
in_service_pct = 100.0

[load]
# Net power factor the transmission grid sees at each load bus.  Distribution-
# level PF correction is assumed already applied below the model boundary, so
# this is the residual load PF the network must carry:
#   qd = pd · tan(acos(power_factor)).
#   1.0  ⇒ purely active load (lines carry only active power);
#   0.98 ⇒ a small lagging reactive draw (more realistic);
#   lower values draw more reactive from the grid (absorbs more line charging).
power_factor = 0.98

[generators]
# Generator reactive capability.
#   apparent_power_limit — enforce the MVA capability circle  P² + Q² ≤ S²  on
#                          each unit (convex/SOC, Ipopt-safe).  Set to false to
#                          RELAX it (falls back to the ±Pmax reactive box) if the
#                          full model becomes too hard to solve.
#   rated_power_factor   — synchronous units (thermal/hydro): MVA circle radius
#                          S_rated = installed MVA / rated_power_factor.  0.90 is
#                          a defensible value (±48 % reactive headroom at full P).
#   renewable_power_factor — inverter-based Wind/Solar: reactive is capped to
#                          |Q| ≤ tan(acos(pf))·P (tied to ACTUAL output, so a
#                          derated farm cannot sit at a very low PF).  0.95 ≈ the
#                          Spanish grid-code reactive requirement.
apparent_power_limit   = true
rated_power_factor     = 0.90
renewable_power_factor = 0.95

[bellman]
# Shared source of the long-term hydro cost-to-go (Bellman cuts produced by the
# weekly scheduling model).  Both stages of the market chain read from here:
#   • the day-ahead dispatch always uses the *full* cut set, coupling all 24
#     hours so reservoir hydro is allocated against the cost-to-go;
#   • the redispatch uses either the binding constant water value or the full
#     cuts, selected by [redispatch].water_value.
bgn_date     = "2024-07-02"          # start date of the long-term model
ssv_step     = 168                   # stage length in hours (1 week)
bellman_file = "Data/BellmanValuesOUT.csv"
volume_file  = "Data/Volume_Scen0_OUT.csv"

[da]
# ── Stage 1: Day-Ahead market ────────────────────────────────────────────────
# A copper-plate economic dispatch solving all 24 hours of the day at once.
# There are NO transmission or voltage limits — the DA market clears energy
# only, leaving network congestion to be resolved by the redispatch stage.
# Reservoir hydro is coupled across the day through the full Bellman cost-to-go
# (the binding cut supplies its opportunity cost), so the intra-day hydro
# schedule respects the long-term water value.  Cross-border exchange enters as
# a fixed import (see [crossborder]).  Uses the DA forecast for wind, solar and
# load: ES_old col "-12" × DA scale factor (always 1.0).
enabled = true
# Nuclear must-run floor: minimum stable generation as a fraction of available
# Pmax, so baseload nuclear cannot be backed off at the solar peak (it holds
# >= this level all day and RES is curtailed instead).  0.0 = no floor (old
# behaviour, nuclear free to shut down).  The DA sets the profile; the intraday
# gates and redispatch freeze nuclear at that DA value.
nuclear_min_gen_frac = 0.8

[id2]
# ── Stage 2: Intraday market — second gate ───────────────────────────────────
# Same copper-plate formulation as DA.  Uses ES_old col "-12" scaled by the ID2
# factor from the new probabilistic files.  Nuclear units are frozen at their
# DA dispatch for this and all subsequent stages.  (ID1 / first intraday gate
# is not modelled.)
enabled = true

[id3]
# ── Stage 3: Intraday market — third gate ────────────────────────────────────
# Closes 10:00 on the delivery day and trades ONLY the last 12 delivery hours
# (12–23), scaled by the ID3 factor.  Hours 0–11 are not retradeable here and
# keep their ID2 schedule; their reservoir use is locked, so ID3 only reallocates
# the remaining water across hours 12–23 against the Bellman cost-to-go.  Nuclear
# units remain frozen at their DA dispatch.  Requires [id2].enabled = true.
enabled = true

[cid]
# ── Stage 4: Continuous Intraday market ──────────────────────────────────────
# Modelled as auction gates closing one hour before each delivery hour.  For each
# hour we re-clear the remaining horizon with all earlier hours frozen at their
# committed CID value, then commit this hour (24 rolling solves/day).  Earlier
# hours' reservoir use is locked, so water cannot be reallocated backwards in
# time.  Uses the CID-scaled profiles; the committed schedule anchors the
# redispatch.  For the first 12 hours its predecessor is ID2 (no ID3 there).
enabled = true

[balancing]
# ── Stage 5: Balancing market ────────────────────────────────────────────────
# Final adjustment market, cleared after the continuous intraday and just before
# the network redispatch.  Same copper-plate formulation as the intraday gates:
# all 24 hours are tradable and anchored to the CID schedule with minimum
# movement (cost-optimal first, then least deviation), so it only adjusts the
# dispatch to cover the balancing forecast update.  Probabilistic load/solar/wind
# changes are read from the "BE" column of the new ES files (ES_old col "-12" ×
# BE factor).  Nuclear stays frozen at its DA dispatch.  The cleared balancing
# schedule — and the BE profiles — anchor the redispatch.  Requires [da].enabled.
enabled = true

[crossborder]
# Fix the market-cleared FR/PT import/export schedule at the border buses.
# Reads Data/crossborder.csv and injects each country's net exchange as a
# costless fixed generator at the foreign terminal buses (disaggregated
# proportionally to line thermal ratings).
enabled = true

# ── Stage 2: Redispatch ──────────────────────────────────────────────────────
[redispatch]
# Make the CID schedule network-feasible with a full AC OPF anchored to the
# CID dispatch.  Nuclear, run-of-river hydro, biomass and coal are frozen at
# their CID set-point; every other unit (Gas, Oil, reservoir & pumped hydro,
# Li-Ion BESS within ±rated power, plus curtailable Wind and Solar) is free
# to be re-dispatched around its anchored market schedule.
#   enabled = false → run the day-ahead stage only.
enabled = true

# Network model used to make the anchored schedule feasible:
#   "AC" — full nonlinear AC OPF (Ipopt): bus voltages, reactive power and the
#          apparent-power (MVA) thermal / generator-capability limits are all
#          enforced.  This is the reactive-realism path.
#   "DC" — linear DC OPF: active power and bus angles only.  Voltages and
#          reactive power are not modelled, thermal limits act on the active
#          (MW) flow, and the [network].voltage_band, [reactors], [load] and
#          [generators] reactive knobs have no effect.  Much faster and feasible
#          in cases where the AC problem is not, at the cost of reactive/voltage
#          security.  Being linear (LP/convex QP with the quadratic anchor), it
#          is solved exactly with Gurobi instead of Ipopt.
power_flow = "AC"

# Reservoir hydro opportunity cost during redispatch:
#   "constant"  — binding cut slope at V_ES_start used as a fixed marginal cost
#                 (EUR/MWh); each hour solved independently (fast).
#   "piecewise" — full Bellman cuts coupling all 24 hours in one AC OPF (slow,
#                 mirrors the DA hydro treatment).
water_value = "constant"

# How the redispatch is allowed to deviate from the DA schedule:
#   "quadratic"     — min  base_cost + anchor_weight · Σ (P_g − P_DA_g)²  [MW²].
#                     Larger anchor_weight ⇒ closer to DA; smaller ⇒ cheaper
#                     redispatch allowed.  Simple, well-conditioned (default).
#   "cost_weighted" — min  Σ c_g · (Δup_g + Δdown_g),  P_g = P_DA_g + Δup − Δdown.
#                     Minimises the real cost of redispatch; reservoir Δ priced
#                     at the water value.
objective     = "quadratic"
anchor_weight = 0.8

# Run the network load flow (this redispatch stage) on its own, reusing the
# market schedule from a PREVIOUS run instead of clearing stages 1–5 again.
#   ""    — run the full chain (day-ahead → … → balancing → redispatch).
#   "BAL" — skip the market stages and anchor the load flow to the saved
#           results/<label>/bal_dispatch.csv; likewise "CID"/"ID3"/"ID2"/"DA".
# The Bellman water value is recomputed each run (cheap, clearing-independent).
# The saved *_dispatch.csv it reads are left untouched; only the redispatch
# outputs (summary/gen_dispatch/branch_flows/fuel_mix/bus_voltages) are rewritten.
from_saved = "BAL"

# Restrict the load flow to a single delivery hour (or a single day).
#   ""             — every hour of every target day.
#   "2024-07-08 14" — only 14:00 on 2024-07-08 (needs water_value = "constant").
#   "2024-07-08"    — all 24 hours of that day only.
# Pins TARGET_DAYS too, so the market stages / Bellman pre-compute skip the
# other day. NOTE: a single-hour run rewrites the redispatch output CSVs with
# just that hour — copy them off first if you need the full-day results.
only = ""

[midterm]
# ── Mid-term hydro scheduling (in-house Bellman cuts via SDDP) ───────────────
# A 3-zone (FR/ES/PT) weekly hydro-thermal SDDP that computes the Bellman cuts
# itself from Data/smspp_in + Data/ts, replacing the SMS++ output.  Missing
# FR/PT time series are synthesised from the ES shapes rescaled to each unit's
# annual Energy/Capacity.  Run with:  julia --project=. midterm_sddp.jl
# To use its cuts in the market chain, point [bellman].bellman_file and
# volume_file at the two outputs below.
n_stages    = 78         # weekly stages → Timestep 0..77 in the cut file
block_hours = 2          # within-week time step [h]; must divide 24
iterations  = 150        # SDDP training iterations
voll        = 3000.0     # unserved-energy penalty [EUR/MWh]
solver      = "gurobi"   # "gurobi" | "highs"
sim_year    = 1982       # climate year for the Volume_Scen0 trajectory
year_stride = 1          # use every k-th climate year (1 = all 37 scenarios)
seed        = 1234
cuts_out    = "Data/BellmanValuesOUT_sddp.csv"
volume_out  = "Data/Volume_Scen0_OUT_sddp.csv"

[midterm4]
# ── Mid-term hydro scheduling, 4-node 2024 system (in-house SDDP) ────────────
# ES / PT / FR / EU (rest of Europe) on the real ~2024 system: capacities from
# Data/Generation.csv, NTCs from Data/Transmission.csv, pumped storage from
# Data/Storage.csv, costs from Data/generation_cost_pypsa_2024.csv, and hourly
# EMPIRE series (Data/ts/EMPIRE, 2015–2019 = 5 joint weather scenarios).
# 3 reservoir states (ES, FR, EU); PT turbines a weekly inflow budget.
# Run with:  julia --project=. midterm_sddp4.jl   ("resim" arg → diagnostics)
n_stages    = 78         # weekly stages → Timestep 0..77 in the cut file
block_hours = 2          # within-week time step [h]; must divide 24
iterations  = 60         # SDDP iterations per run (use "cont" arg to add more)
voll        = 3000.0     # unserved-energy penalty [EUR/MWh]
solver      = "gurobi"   # "gurobi" | "highs"
sim_year    = 1982       # EDF climate year for the exported volume trajectory
seed        = 1234
cuts_out    = "Data/BellmanValuesOUT_sddp4.csv"
volume_out  = "Data/Volume_Scen0_OUT_sddp4.csv"

[midterm4.reservoir]
# Seasonal reservoir sizes (public data): FR ≈ French lakes; EU ≈ Norway 87 +
# Sweden 34 + Alps/Italy ≈ 24 TWh.  fill0 = fraction full at the July start.
vmax_twh = { FR = 3.6, EU = 145.0 }   # ES comes from SS_SeasonalStorage.csv
fill0    = { FR = 0.65, EU = 0.65 }

[midterm4.availability]
# Mean availability (maintenance + forced outages) applied to thermal capacity.
# Nuclear 0.90 is the non-French fleets (Nordics/BE/CZ/CH ran ~85-92 % in 2024);
# the French fleet is overridden per zone below.  Conventional thermal ~90 %.
Nuclear    = 0.90
Coal       = 0.90
Lignite    = 0.90
"Gas CCGT" = 0.90
"Gas OCGT" = 0.95
Oil        = 0.90
Bio        = 0.85
Waste      = 0.85
Geo        = 0.90

[midterm4.availability.FR]
# Zone override: French nuclear ran at ~70 % CF in 2024 (heavy maintenance).
Nuclear    = 0.85

[midterm4.gas_cost]
# Zone-specific 2024 gas marginal cost [EUR/MWh_el]: Iberia buys on MIBGAS
# (~31 EUR/MWh_th) vs TTF (~34) for FR/EU; cost = fuel/eta + CO2 + VOM.
# Replaces the single pypsa CCGT figure (93.16, near-tied with coal 94.01)
# that pinned every zone's marginal price at ~93 EUR/MWh.
ccgt = { ES = 78.0, PT = 78.0, FR = 87.0, EU = 87.0 }
ocgt = { ES = 105.0, PT = 105.0, FR = 117.0, EU = 117.0 }
